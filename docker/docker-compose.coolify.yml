# Coolify / homeserver stack for this fork.
# Builds production images from local Dockerfiles (does not pull codewithcj/*).
# See docker/coolify_deployments.md for Coolify UI settings and env checklist.

services:
  sparkyfitness-db:
    image: postgres:18.3-alpine
    container_name: sparkyfitness-db
    restart: always
    environment:
      POSTGRES_DB: ${SPARKY_FITNESS_DB_NAME:?Variable is required and must be set}
      POSTGRES_USER: ${SPARKY_FITNESS_DB_USER:?Variable is required and must be set}
      POSTGRES_PASSWORD: ${SPARKY_FITNESS_DB_PASSWORD:?Variable is required and must be set}
      PUID: 1000
      GUID: 1000
    volumes:
      - ${DB_PATH:?Variable is required and must be set}:/var/lib/postgresql
    networks:
      - sparkyfitness-network

  sparkyfitness-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: sparkyfitness-server
    restart: always
    environment:
      SPARKY_FITNESS_LOG_LEVEL: ${SPARKY_FITNESS_LOG_LEVEL:-ERROR}
      ALLOW_PRIVATE_NETWORK_CORS: ${ALLOW_PRIVATE_NETWORK_CORS:-false}
      ALLOW_PRIVATE_NETWORK_AI: ${ALLOW_PRIVATE_NETWORK_AI:-false}
      SPARKY_FITNESS_EXTRA_TRUSTED_ORIGINS: ${SPARKY_FITNESS_EXTRA_TRUSTED_ORIGINS:-}
      SPARKY_FITNESS_PUBLIC_API_DOCS: ${SPARKY_FITNESS_PUBLIC_API_DOCS:-false}
      SPARKY_FITNESS_DB_USER: ${SPARKY_FITNESS_DB_USER:-sparky}
      SPARKY_FITNESS_DB_HOST: sparkyfitness-db
      SPARKY_FITNESS_DB_NAME: ${SPARKY_FITNESS_DB_NAME:?Variable is required and must be set}
      SPARKY_FITNESS_DB_PASSWORD: ${SPARKY_FITNESS_DB_PASSWORD:?Variable is required and must be set}
      SPARKY_FITNESS_APP_DB_USER: ${SPARKY_FITNESS_APP_DB_USER:-sparkyapp}
      SPARKY_FITNESS_APP_DB_PASSWORD: ${SPARKY_FITNESS_APP_DB_PASSWORD:?Variable is required and must be set}
      SPARKY_FITNESS_DB_PORT: 5432
      SPARKY_FITNESS_API_ENCRYPTION_KEY: ${SPARKY_FITNESS_API_ENCRYPTION_KEY:?Variable is required and must be set}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Variable is required and must be set}
      SPARKY_FITNESS_FRONTEND_URL: ${SPARKY_FITNESS_FRONTEND_URL:?Variable is required and must be set}
      SPARKY_FITNESS_DISABLE_SIGNUP: ${SPARKY_FITNESS_DISABLE_SIGNUP:-false}
      SPARKY_FITNESS_ADMIN_EMAIL: ${SPARKY_FITNESS_ADMIN_EMAIL:-}
      GARMIN_MICROSERVICE_URL: ${GARMIN_MICROSERVICE_URL:-http://sparkyfitness-garmin:${GARMIN_SERVICE_PORT:-8000}}
      GHD_MICROSERVICE_URL: ${GHD_MICROSERVICE_URL:-http://sparkyfitness-ghd:8001}
      NODE_ENV: ${NODE_ENV:-production}
      TZ: ${TZ:-Etc/UTC}
      SPARKY_FITNESS_FORCE_EMAIL_LOGIN: ${SPARKY_FITNESS_FORCE_EMAIL_LOGIN:-}
      DEV_TOOLS_ENABLED: ${DEV_TOOLS_ENABLED:-false}
      PUID: 1000
      GUID: 1000
    networks:
      - sparkyfitness-network
    depends_on:
      - sparkyfitness-db
    volumes:
      - ${SERVER_BACKUP_PATH:?Variable is required and must be set}:/app/SparkyFitnessServer/backup
      - ${SERVER_UPLOADS_PATH:?Variable is required and must be set}:/app/SparkyFitnessServer/uploads

  sparkyfitness-frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: sparkyfitness-frontend
    restart: always
    ports:
      - "${SPARKY_FITNESS_FRONTEND_PORT:-3004}:${NGINX_LISTEN_PORT:-80}"
    environment:
      SPARKY_FITNESS_FRONTEND_URL: ${SPARKY_FITNESS_FRONTEND_URL:?Variable is required and must be set}
      SPARKY_FITNESS_SERVER_HOST: sparkyfitness-server
      SPARKY_FITNESS_SERVER_PORT: 3010
      NGINX_RATE_LIMIT: ${NGINX_RATE_LIMIT:-5r/s}
      NGINX_LISTEN_PORT: ${NGINX_LISTEN_PORT:-}
      NGINX_DUMP_CONFIG: ${NGINX_DUMP_CONFIG:-false}
      PUID: 1000
      GUID: 1000
    networks:
      - sparkyfitness-network
    depends_on:
      - sparkyfitness-server
      - sparkyfitness-garmin

  sparkyfitness-garmin:
    build:
      context: ..
      dockerfile: docker/Dockerfile.garmin_microservice
    container_name: sparkyfitness-garmin
    restart: unless-stopped
    environment:
      GARMIN_MICROSERVICE_URL: ${GARMIN_MICROSERVICE_URL:-http://sparkyfitness-garmin:${GARMIN_SERVICE_PORT:-8000}}
      GARMIN_SERVICE_PORT: ${GARMIN_SERVICE_PORT:-8000}
      GARMIN_SERVICE_IS_CN: ${GARMIN_SERVICE_IS_CN:-false}
      PUID: 1000
      GUID: 1000
    networks:
      - sparkyfitness-network
    depends_on:
      - sparkyfitness-db
      - sparkyfitness-server

  sparkyfitness-ghd:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ghd_microservice
    container_name: sparkyfitness-ghd
    restart: unless-stopped
    environment:
      GHD_MICROSERVICE_URL: ${GHD_MICROSERVICE_URL:-http://sparkyfitness-ghd:8001}
      GHD_SERVICE_PORT: ${GHD_SERVICE_PORT:-8001}
      GHD_DATA_DIR: /data
      PUID: 1000
      GUID: 1000
    volumes:
      - ${GHD_DATA_PATH:?Variable is required and must be set}:/data
    networks:
      - sparkyfitness-network
    depends_on:
      - sparkyfitness-db
      - sparkyfitness-server

networks:
  sparkyfitness-network:
    driver: bridge
