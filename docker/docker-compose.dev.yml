# Local hot-reload stack for feature development.
# See docker/startup_commands.md for copy-paste start/stop/logs commands.

services:
  sparkyfitness-db:
    image: postgres:18.3-alpine
    container_name: sparkyfitness-db
    restart: always
    env_file:
      - ../.env.local
    environment:
      POSTGRES_DB: ${SPARKY_FITNESS_DB_NAME:?Variable is required and must be set}
      POSTGRES_USER: ${SPARKY_FITNESS_DB_USER:?Variable is required and must be set}
      POSTGRES_PASSWORD: ${SPARKY_FITNESS_DB_PASSWORD:?Variable is required and must be set}
    volumes:
      - ./docker_volume/postgresql:/var/lib/postgresql:z
    networks:
      - sparkyfitness-network
    ports:
      - "5432:5432"

  sparkyfitness-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend.dev
    command: pnpm start
    env_file:
      - ../.env.local
    environment:
      SPARKY_FITNESS_LOG_LEVEL: ${SPARKY_FITNESS_LOG_LEVEL:-DEBUG}
      ALLOW_PRIVATE_NETWORK_CORS: ${ALLOW_PRIVATE_NETWORK_CORS:-true}
      ALLOW_PRIVATE_NETWORK_AI: ${ALLOW_PRIVATE_NETWORK_AI:-true}
      SPARKY_FITNESS_EXTRA_TRUSTED_ORIGINS: ${SPARKY_FITNESS_EXTRA_TRUSTED_ORIGINS:-}
      SPARKY_FITNESS_PUBLIC_API_DOCS: ${SPARKY_FITNESS_PUBLIC_API_DOCS:-false}
      SPARKY_FITNESS_DB_USER: ${SPARKY_FITNESS_DB_USER:-sparky}
      SPARKY_FITNESS_DB_HOST: ${SPARKY_FITNESS_DB_HOST:-sparkyfitness-db}
      SPARKY_FITNESS_DB_NAME: ${SPARKY_FITNESS_DB_NAME:?Variable is required and must be set}
      SPARKY_FITNESS_DB_PASSWORD: ${SPARKY_FITNESS_DB_PASSWORD:?Variable is required and must be set}
      SPARKY_FITNESS_APP_DB_USER: ${SPARKY_FITNESS_APP_DB_USER:-sparkyapp}
      SPARKY_FITNESS_APP_DB_PASSWORD: ${SPARKY_FITNESS_APP_DB_PASSWORD:?Variable is required and must be set}
      SPARKY_FITNESS_DB_PORT: ${SPARKY_FITNESS_DB_PORT:-5432}
      SPARKY_FITNESS_API_ENCRYPTION_KEY: ${SPARKY_FITNESS_API_ENCRYPTION_KEY:?Variable is required and must be set}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Variable is required and must be set}
      SPARKY_FITNESS_FRONTEND_URL: ${SPARKY_FITNESS_FRONTEND_URL:-http://localhost:8080}
      SPARKY_FITNESS_DISABLE_SIGNUP: ${SPARKY_FITNESS_DISABLE_SIGNUP:-false}
      SPARKY_FITNESS_ADMIN_EMAIL: ${SPARKY_FITNESS_ADMIN_EMAIL:-}
      SPARKY_FITNESS_EMAIL_HOST: ${SPARKY_FITNESS_EMAIL_HOST:-}
      SPARKY_FITNESS_EMAIL_PORT: ${SPARKY_FITNESS_EMAIL_PORT:-}
      SPARKY_FITNESS_EMAIL_SECURE: ${SPARKY_FITNESS_EMAIL_SECURE:-}
      SPARKY_FITNESS_EMAIL_USER: ${SPARKY_FITNESS_EMAIL_USER:-}
      SPARKY_FITNESS_EMAIL_PASS: ${SPARKY_FITNESS_EMAIL_PASS:-}
      SPARKY_FITNESS_EMAIL_FROM: ${SPARKY_FITNESS_EMAIL_FROM:-}
      GARMIN_MICROSERVICE_URL: ${GARMIN_MICROSERVICE_URL:-http://sparkyfitness-garmin:${GARMIN_SERVICE_PORT:-8000}}
      GHD_MICROSERVICE_URL: ${GHD_MICROSERVICE_URL:-http://sparkyfitness-ghd:8001}
      NODE_ENV: ${NODE_ENV:-development}
      TZ: ${TZ:-Etc/UTC}
      SPARKY_FITNESS_FORCE_EMAIL_LOGIN: ${SPARKY_FITNESS_FORCE_EMAIL_LOGIN:-}
      DEV_TOOLS_ENABLED: ${DEV_TOOLS_ENABLED:-true}
    volumes:
      - ../SparkyFitnessServer:/app/SparkyFitnessServer:z
      - /app/SparkyFitnessServer/node_modules
      - ./docker_volume/uploads:/app/SparkyFitnessServer/uploads:z
      - ./docker_volume/backup:/app/SparkyFitnessServer/backup:z
    networks:
      - sparkyfitness-network
    ports:
      - "3010:3010"
    restart: always
    depends_on:
      - sparkyfitness-db

  sparkyfitness-frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend.dev
    environment:
      SPARKY_FITNESS_FRONTEND_URL: ${SPARKY_FITNESS_FRONTEND_URL:-http://localhost:8080}
      SPARKY_FITNESS_SERVER_HOST: sparkyfitness-server
      SPARKY_FITNESS_SERVER_PORT: 3010
      VITE_BACKEND_HOST: sparkyfitness-server
    ports:
      - "8080:8080"
    volumes:
      - ../SparkyFitnessFrontend:/app/SparkyFitnessFrontend:z
      - /app/SparkyFitnessFrontend/node_modules
    networks:
      - sparkyfitness-network
    restart: always
    depends_on:
      - sparkyfitness-server
      - sparkyfitness-garmin

  sparkyfitness-garmin:
    build:
      context: ..
      dockerfile: docker/Dockerfile.garmin_microservice.dev
    container_name: sparkyfitness-garmin
    environment:
      GARMIN_MICROSERVICE_URL: ${GARMIN_MICROSERVICE_URL:-http://sparkyfitness-garmin:${GARMIN_SERVICE_PORT:-8000}}
      GARMIN_SERVICE_PORT: ${GARMIN_SERVICE_PORT:-8000}
      GARMIN_SERVICE_IS_CN: ${GARMIN_SERVICE_IS_CN:-false}
      PUID: 1000
      GUID: 1000
    volumes:
      - ../SparkyFitnessGarmin:/app/SparkyFitnessGarmin:z
    networks:
      - sparkyfitness-network
    restart: unless-stopped
    depends_on:
      - sparkyfitness-db
      - sparkyfitness-server

  sparkyfitness-ghd:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ghd_microservice.dev
    container_name: sparkyfitness-ghd
    environment:
      GHD_MICROSERVICE_URL: ${GHD_MICROSERVICE_URL:-http://sparkyfitness-ghd:8001}
      GHD_SERVICE_PORT: ${GHD_SERVICE_PORT:-8001}
      GHD_DATA_DIR: /data
      PUID: 1000
      GUID: 1000
    volumes:
      - ../SparkyFitnessGhd:/app/SparkyFitnessGhd:z
      - ./docker_volume/ghd_data:/data:z
    ports:
      - "8001:8001"
    networks:
      - sparkyfitness-network
    restart: unless-stopped
    depends_on:
      - sparkyfitness-db
      - sparkyfitness-server

networks:
  sparkyfitness-network:
    driver: bridge
